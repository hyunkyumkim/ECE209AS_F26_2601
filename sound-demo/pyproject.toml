[project]
name = "yamnet-microphone-demo"
version = "0.1.0"
description = "Local pretrained whistle/knock detection with a browser microphone interface."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6,<3",
    "scipy==1.17.1",
    "tensorflow==2.21.0",
    "tensorflow-hub==0.16.1",
    # TensorFlow Hub imports pkg_resources, removed in setuptools 81.
    "setuptools<81",
]

[tool.uv]
package = false
